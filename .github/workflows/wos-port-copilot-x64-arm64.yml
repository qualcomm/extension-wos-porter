name: WoS Port with x64 Benchmark (Copilot CLI, x64 → ARM64)

# Two-job pipeline:
#   Job 1 — x64-benchmark  : runs x64-benchmarker agent on a Windows x64 runner.
#            Clones the target repo, builds for x64, discovers/generates benchmarks,
#            runs them, and uploads the x64_benchmark/ directory as a workflow artifact.
#   Job 2 — arm64-port     : runs wos-porter agent on a Windows ARM64 runner.
#            Downloads the x64 benchmark artifact, places it beside the freshly-cloned
#            repo, and passes its location to the wos-porter prompt so the ARM64
#            benchmark phase can compare against the x64 baseline.
#
# Auth: requires a repo secret COPILOT_GITHUB_TOKEN containing a fine-grained PAT
# (v2) with the "Copilot Requests" permission.  The built-in ${{ secrets.GITHUB_TOKEN }}
# does not carry that scope and cannot be used here.

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository to port (https://github.com/owner/repo or owner/repo)"
        required: true
        type: string
      copilot_model:
        description: "Copilot CLI model (auto, claude-sonnet-4.6, gpt-5.4, claude-haiku-4.5, ...)"
        required: false
        type: string
        default: "auto"
      max_autopilot_continues:
        description: "Max autopilot continuation messages (analog of Claude --max-turns)"
        required: false
        type: string
        default: "400"

concurrency:
  group: wos-port-copilot-${{ github.event.inputs.repo_url }}
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: x64 build + benchmark
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  x64-benchmark:
    name: "x64 — Build & Benchmark"
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ALLOW_ALL: "true"
      WOS_REPO_URL: ${{ github.event.inputs.repo_url }}
      COPILOT_MODEL: ${{ github.event.inputs.copilot_model }}
      MAX_AUTOPILOT_CONTINUES: ${{ github.event.inputs.max_autopilot_continues }}

    steps:
      # ── 1. Source: check out this extension repo (agents + skills live here) ──
      - name: Checkout extension repo
        uses: actions/checkout@v4

      # ── 2. Guard: token must be present ──
      - name: Verify COPILOT_GITHUB_TOKEN
        shell: pwsh
        run: |
          if (-not $env:COPILOT_GITHUB_TOKEN) {
            Write-Error "COPILOT_GITHUB_TOKEN secret is missing. Add a fine-grained PAT with 'Copilot Requests' permission."
            exit 1
          }
          Write-Host "Token present (length=$($env:COPILOT_GITHUB_TOKEN.Length))"

      # ── 3. Runtime: Node + Copilot CLI ──
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install GitHub Copilot CLI
        shell: pwsh
        run: |
          npm install -g @github/copilot
          copilot --version

      # ── 4. Info: show what build tools are available ──
      - name: Show x64 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -property installationPath
            Write-Host "VS: $vsPath"
            $cl = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter cl.exe |
                  Where-Object { $_.FullName -match 'Hostx64\\x64' } |
                  Select-Object -First 1 -ExpandProperty FullName
            Write-Host "cl.exe (x64): $cl"
          }
          Get-Command cmake, ninja, git, python, cargo, go, msbuild `
            -ErrorAction SilentlyContinue | Format-Table Name, Source

      # ── 5. Install all agents + skills from this repo into ~/.copilot ──
      #       and export the dirs Copilot CLI needs to discover them.
      - name: Install agents and skills into ~/.copilot
        shell: pwsh
        run: |
          $home_     = $env:USERPROFILE
          $agentsDst = Join-Path $home_ ".copilot\agents"
          $skillsDst = Join-Path $home_ ".copilot\skills"
          $instrDst  = Join-Path $home_ ".copilot\instructions"
          $promptsDst= Join-Path $home_ ".copilot\prompts"

          foreach ($d in @($agentsDst, $skillsDst, $instrDst, $promptsDst)) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          # Copy only x64-benchmarker — do NOT install wos-* agents here.
          # Installing all agents risks the CLI picking up wos-porter and running
          # ARM64 porting work on the x64 runner.
          $agentSrc = Join-Path $env:GITHUB_WORKSPACE "agents\x64-benchmarker.agent.md"
          $raw = Get-Content -Raw -LiteralPath $agentSrc
          if ($raw -notmatch '(?s)^---\r?\n(.*?)\r?\n---\r?\n(.*)$') {
            Write-Error "No frontmatter: $agentSrc"; exit 1
          }
          $fm = ($Matches[1] -split "`r?`n") |
                Where-Object { $_ -notmatch '^\s*(argument-hint|user-invocable)\s*:' }
          $out = "---`n$(($fm -join "`n").Trim())`n---`n$($Matches[2])"
          $dst = Join-Path $agentsDst "x64-benchmarker.agent.md"
          Set-Content -LiteralPath $dst -Value $out -Encoding UTF8
          Write-Host "agent  -> $dst"

          # Skills (each is a subdirectory with SKILL.md)
          Get-ChildItem "$env:GITHUB_WORKSPACE\skills" -Directory | ForEach-Object {
            $dst = Join-Path $skillsDst $_.Name
            Copy-Item $_.FullName -Destination $dst -Recurse -Force
            Write-Host "skill  -> $dst"
          }

          # Instructions
          Get-ChildItem "$env:GITHUB_WORKSPACE\instructions\*.instructions.md" |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $instrDst -Force
              Write-Host "instr  -> $(Join-Path $instrDst $_.Name)"
            }

          # Prompts (optional)
          if (Test-Path "$env:GITHUB_WORKSPACE\prompts") {
            Get-ChildItem "$env:GITHUB_WORKSPACE\prompts\*.prompt.md" -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName -Destination $promptsDst -Force }
          }

          # Export so every subsequent step (and the copilot process) can find them.
          "COPILOT_AGENTS_DIRS=$agentsDst"             | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "COPILOT_SKILLS_DIRS=$skillsDst"             | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "COPILOT_CUSTOM_INSTRUCTIONS_DIRS=$instrDst" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host ""
          Write-Host "=== Agents installed ==="
          Get-ChildItem $agentsDst | Select-Object -ExpandProperty Name
          Write-Host "=== Skills installed ==="
          Get-ChildItem $skillsDst -Directory | Select-Object -ExpandProperty Name

      # ── 6. Create work directory (must exist before working-directory: is used) ──
      - name: Create work directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "C:\src\x64-bench" | Out-Null

      # ── 7. Run x64-benchmarker agent ──
      #       The agent receives only the GitHub link. It handles everything:
      #       clone → build x64 → run tests → run/generate benchmarks → write results.
      #       All output lands in <repo>\x64_benchmark\ inside C:\src\x64-bench\.
      - name: Run x64-benchmarker
        working-directory: C:\src\x64-bench
        shell: pwsh
        env:
          X64_BENCH_WORKDIR: C:\src\x64-bench
          COPILOT_TASK_WAIT_TIMEOUT_SECONDS: "6600"   # wait up to 110 min (job limit 120)
        run: |
          Write-Host "Repo : $env:WOS_REPO_URL"
          Write-Host "Model: $env:COPILOT_MODEL"
          Write-Host "Workdir: C:\src\x64-bench"

          $prompt = "Clone $env:WOS_REPO_URL into C:\src\x64-bench. " +
                    "Build it for x64 Release. " +
                    "Run all tests and benchmarks. " +
                    "If no benchmarks exist, write a benchmark, build it, and run it. " +
                    "Save all benchmark results and any generated benchmark source file under x64_benchmark\ inside the cloned repo."

          copilot `
            -p $prompt `
            --agent=x64-benchmarker `
            --model=$env:COPILOT_MODEL `
            --autopilot `
            --max-autopilot-continues ([int]$env:MAX_AUTOPILOT_CONTINUES) `
            --allow-all-tools `
            --allow-all-paths `
            --allow-all-urls

          Write-Host "Exit code: $LASTEXITCODE"

      # ── 8. Dump work directory tree so failures are diagnosable ──
      - name: Dump work directory tree
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== C:\src\x64-bench tree ==="
          Get-ChildItem -Recurse "C:\src\x64-bench" -ErrorAction SilentlyContinue |
            Select-Object FullName | Format-Table -AutoSize

      # ── 9. Locate benchmark output written by the agent ──
      - name: Locate benchmark results
        id: stage
        if: always()
        shell: pwsh
        run: |
          $workRoot = "C:\src\x64-bench"

          $repo = Get-ChildItem -Directory $workRoot -ErrorAction SilentlyContinue |
                  Where-Object { Test-Path (Join-Path $_.FullName ".git") } |
                  Select-Object -First 1

          if (-not $repo) {
            Write-Warning "No cloned repo found under $workRoot — agent did not complete Phase 1."
            "repo_name=unknown" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "bench_dir="        | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          "repo_name=$($repo.Name)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $benchDir = Join-Path $repo.FullName "x64_benchmark"
          if (Test-Path $benchDir) {
            "bench_dir=$benchDir" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Benchmark dir: $benchDir"
            Get-ChildItem -Recurse $benchDir | Select-Object FullName | Format-Table -AutoSize
          } else {
            Write-Warning "x64_benchmark\ not found — agent did not complete benchmarking phases."
            "bench_dir=" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      # ── 9. Upload benchmark results + generated benchmark file (if any) ──
      #       Upload everything under x64_benchmark\ — the agent may write files
      #       directly there (REPORT.md, build.log, *.txt) rather than under a
      #       results\ subdirectory, so a wildcard on the whole directory is safer.
      - name: Upload x64 benchmark results
        if: always() && steps.stage.outputs.bench_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: x64-benchmark-${{ steps.stage.outputs.repo_name }}
          path: ${{ steps.stage.outputs.bench_dir }}\**
          if-no-files-found: warn

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: ARM64 port + optimize (receives x64 benchmark results from Job 1)
# Based on the working single-job wos-port-copilot reference script.
# Only addition: download x64 benchmark artifact from Job 1 and pass its
# path to wos-porter so Phase 7 can run the differential optimizer.
# ─────────────────────────────────────────────────────────────────────────────
  arm64-port:
    name: "ARM64 — Port & Optimize"
    needs: x64-benchmark
    if: always()
    runs-on: windows-11-arm
    timeout-minutes: 360
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      COPILOT_ALLOW_ALL: "true"
      WOS_REPO_URL: ${{ github.event.inputs.repo_url }}
      COPILOT_MODEL: ${{ github.event.inputs.copilot_model }}
      MAX_AUTOPILOT_CONTINUES: ${{ github.event.inputs.max_autopilot_continues }}

    steps:
      - name: Checkout extension (for agent + instruction sources)
        uses: actions/checkout@v4

      - name: Verify COPILOT_GITHUB_TOKEN is set
        shell: pwsh
        run: |
          if (-not $env:COPILOT_GITHUB_TOKEN) {
            Write-Error "COPILOT_GITHUB_TOKEN secret is not configured on this repository. Create a fine-grained PAT with the 'Copilot Requests' permission and store it as a repo secret named COPILOT_GITHUB_TOKEN."
            exit 1
          }
          Write-Host "COPILOT_GITHUB_TOKEN present (length=$($env:COPILOT_GITHUB_TOKEN.Length))"

      - name: Set up Node.js (for Copilot CLI + npm-based build systems)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install GitHub Copilot CLI
        shell: pwsh
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Show preinstalled ARM64 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $vsPath = & $vswhere -latest -property installationPath
          Write-Host "VS install: $vsPath"
          $cl = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter cl.exe |
                Where-Object { $_.FullName -match 'HostARM64\\ARM64' } |
                Select-Object -First 1 -ExpandProperty FullName
          if (-not $cl) {
            $cl = Get-ChildItem "$vsPath\VC\Tools\MSVC" -Recurse -Filter cl.exe |
                  Where-Object { $_.FullName -match 'Hostx64\\arm64' } |
                  Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "ARM64-target cl.exe: $cl"
          Get-Command cmake, ninja, git, python -ErrorAction SilentlyContinue |
            Format-Table Name, Source

      - name: Install wos-* agents, instructions, skills, and prompts into ~/.copilot
        shell: pwsh
        run: |
          $workRoot = "C:\src\wos-porter"
          New-Item -ItemType Directory -Force -Path $workRoot | Out-Null

          $userHome   = $env:USERPROFILE
          $agentsDst  = Join-Path $userHome ".copilot\agents"
          $instrDst   = Join-Path $userHome ".copilot\instructions"
          $skillsDst  = Join-Path $userHome ".copilot\skills"
          $promptsDst = Join-Path $userHome ".copilot\prompts"
          New-Item -ItemType Directory -Force -Path $agentsDst  | Out-Null
          New-Item -ItemType Directory -Force -Path $instrDst   | Out-Null
          New-Item -ItemType Directory -Force -Path $skillsDst  | Out-Null
          New-Item -ItemType Directory -Force -Path $promptsDst | Out-Null

          # Strip frontmatter keys Copilot CLI rejects (argument-hint, user-invocable).
          # Special case for wos-porter: install it under the private name
          # "wos-porter-orchestrator" so that task(agent_type="wos-porter") inside
          # the agent finds nothing — preventing self-recursion at the CLI level.
          Get-ChildItem "$env:GITHUB_WORKSPACE\agents\wos-*.agent.md" | ForEach-Object {
            $srcPath = $_.FullName
            $dstPath = Join-Path $agentsDst $_.Name
            $raw = Get-Content -Raw -LiteralPath $srcPath
            if ($raw -notmatch '(?s)^---\r?\n(.*?)\r?\n---\r?\n(.*)$') {
              Write-Error "No YAML frontmatter in $srcPath"; exit 1
            }
            $fmLines = ($Matches[1] -split "`r?`n") |
              Where-Object { $_ -notmatch '^\s*(argument-hint|user-invocable)\s*:' }

            if ($_.Name -eq 'wos-porter.agent.md') {
              # Rename the installed agent so the CLI cannot call it as "wos-porter".
              # The run step below uses --agent=wos-porter-orchestrator to match.
              $fmLines = $fmLines | ForEach-Object {
                if ($_ -match '^(\s*name\s*:\s*)["'']?wos-porter["'']?\s*$') {
                  'name: "wos-porter-orchestrator"'
                } else { $_ }
              }
              # Also rename the destination file so it can't be discovered by old name.
              $dstPath = Join-Path $agentsDst 'wos-porter-orchestrator.agent.md'
            }

            $out = "---`n$(($fmLines -join "`n").Trim())`n---`n$($Matches[2])"
            Set-Content -LiteralPath $dstPath -Value $out -Encoding UTF8
            Write-Host "Installed Copilot subagent: $dstPath"
          }

          Copy-Item "$env:GITHUB_WORKSPACE\instructions\*.instructions.md" `
            -Destination $instrDst -Force

          Get-ChildItem "$env:GITHUB_WORKSPACE\skills" -Directory | ForEach-Object {
            $dst = Join-Path $skillsDst $_.Name
            Copy-Item $_.FullName -Destination $dst -Recurse -Force
            Write-Host "Installed skill: $dst"
          }

          if (Test-Path "$env:GITHUB_WORKSPACE\prompts") {
            Copy-Item "$env:GITHUB_WORKSPACE\prompts\*.prompt.md" `
              -Destination $promptsDst -Force -ErrorAction SilentlyContinue
          }

          Write-Host "--- Installed agents ---"
          Get-ChildItem $agentsDst | Select-Object FullName
          Write-Host "--- Installed instructions ---"
          Get-ChildItem $instrDst | Select-Object FullName
          Write-Host "--- Installed skills ---"
          Get-ChildItem $skillsDst -Directory | Select-Object FullName

          "COPILOT_CUSTOM_INSTRUCTIONS_DIRS=$instrDst" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── Download x64 benchmark artifact from Job 1 ──────────────────────────
      - name: Download x64 benchmark results
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: x64-benchmark-*
          path: C:\src\x64-results
          merge-multiple: true
        continue-on-error: true

      # ── Locate downloaded files and set bench_dir output ────────────────────
      - name: Locate x64 benchmark results
        id: x64_bench
        if: always()
        shell: pwsh
        run: |
          $downloadDir = "C:\src\x64-results"
          Write-Host "=== Downloaded artifact tree ==="
          if (Test-Path $downloadDir) {
            Get-ChildItem -Recurse $downloadDir | Select-Object FullName | Format-Table -AutoSize
          } else {
            Write-Warning "$downloadDir not found — Job 1 artifact download failed."
          }
          $files = if (Test-Path $downloadDir) {
            Get-ChildItem -Recurse -File $downloadDir -ErrorAction SilentlyContinue
          }
          if ($files.Count -gt 0) {
            Write-Host "x64 benchmark artifacts available: $($files.Count) file(s)"
            "available=true"         | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "bench_dir=$downloadDir" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            Write-Warning "No x64 benchmark files — wos-porter will run without baseline."
            "available=false" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "bench_dir="      | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      # ── Clone target repo and create arm64-port branch ──────────────────────
      # Do this in the workflow so the agent receives a ready-to-use local path
      # and never needs to clone or create a branch itself.
      - name: Clone target repo and create arm64-port branch
        id: clone
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoUrl = $env:WOS_REPO_URL

          # Normalise owner/repo → full URL
          if ($repoUrl -notmatch '^https?://') {
            $repoUrl = "https://github.com/$repoUrl"
          }

          # Derive repo name from URL (last path segment, strip .git)
          $repoName = ($repoUrl -split '/')[-1] -replace '\.git$', ''

          $workRoot = "C:\src\wos-porter"
          New-Item -ItemType Directory -Force -Path $workRoot | Out-Null
          $repoDir = Join-Path $workRoot $repoName

          # Remove stale clone if present
          if (Test-Path $repoDir) {
            Write-Host "Removing existing $repoDir"
            Remove-Item -Recurse -Force $repoDir
          }

          Write-Host "Cloning $repoUrl -> $repoDir"
          git clone --recurse-submodules $repoUrl $repoDir
          if ($LASTEXITCODE -ne 0) { Write-Error "git clone failed"; exit 1 }

          git config --global user.email "ci-wos-porter@github-actions"
          git config --global user.name  "CI wos-porter"

          Write-Host "Creating arm64-port branch"
          git -C $repoDir checkout -b arm64-port
          if ($LASTEXITCODE -ne 0) { Write-Error "git checkout -b arm64-port failed"; exit 1 }

          Write-Host "Repo cloned and branch created: $repoDir"
          git -C $repoDir branch -a

          "repo_dir=$repoDir"   | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "repo_name=$repoName" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run wos-porter headless (Copilot CLI)
        working-directory: C:\src\wos-porter
        shell: pwsh
        env:
          REPO_DIR:     ${{ steps.clone.outputs.repo_dir }}
          X64_BENCH_DIR: ${{ steps.x64_bench.outputs.bench_dir }}
          COPILOT_TASK_WAIT_TIMEOUT_SECONDS: "21000"
        run: |
          $ErrorActionPreference = 'Stop'
          $logDir = "C:\src\wos-porter\_logs"
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null

          # Pass the pre-cloned local path so the agent skips Phase 1 cloning.
          # Append x64 benchmark dir if Job 1 produced one.
          $prompt = "Port the repository at $env:REPO_DIR to Windows ARM64. The repository has already been cloned and the arm64-port branch has been created — do NOT clone again, do NOT run git checkout -b. Start from Phase 2 (Analysis)."
          if ($env:X64_BENCH_DIR) {
            $prompt += "`nx64 benchmark results: $env:X64_BENCH_DIR"
            Write-Host "x64 baseline included: $env:X64_BENCH_DIR"
          } else {
            Write-Host "No x64 baseline — running without benchmark comparison."
          }

          Write-Host "Repo dir: $env:REPO_DIR"
          Write-Host "Prompt:   $prompt"
          Write-Host "Model:    $env:COPILOT_MODEL"

          copilot `
            -p $prompt `
            --agent=wos-porter-orchestrator `
            --model=$env:COPILOT_MODEL `
            --autopilot `
            --max-autopilot-continues ([int]$env:MAX_AUTOPILOT_CONTINUES) `
            --allow-all-tools `
            --allow-all-paths `
            --allow-all-urls `
            --output-format=json `
            --log-dir=$logDir `
            --log-level=info `
            2>&1 |
            Tee-Object -FilePath (Join-Path $logDir "copilot-run.jsonl")

          Write-Host "copilot exit code: $LASTEXITCODE"

      # ── After agent run: commit any uncommitted changes to arm64-port ────────
      - name: Commit any uncommitted agent changes to arm64-port
        if: always() && steps.clone.outputs.repo_dir != ''
        working-directory: ${{ steps.clone.outputs.repo_dir }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "=== Branch state after agent run ==="
          git branch -a
          git log --oneline -5

          $status = git status --porcelain
          if ($status) {
            Write-Host "Uncommitted changes — committing to arm64-port:"
            Write-Host $status
            git add -A
            git commit -m "chore: ARM64 port changes (committed by CI after agent run)"
          } else {
            Write-Host "Working tree clean — no extra commit needed."
          }

      - name: Generate arm64-port patch + summary
        if: always() && steps.clone.outputs.repo_dir != ''
        working-directory: ${{ steps.clone.outputs.repo_dir }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $outDir    = "C:\src\wos-porter\_artifacts"
          $seriesDir = Join-Path $outDir "patches"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $port    = 'arm64-port'
          $portSha = (git rev-parse --verify --quiet "refs/heads/$port")
          if (-not $portSha) {
            Write-Warning "Branch '$port' not found — capturing working-tree diff instead."
            git status | Tee-Object (Join-Path $outDir "git-status.txt") | Out-Null
            git diff --binary HEAD | Out-File -Encoding ascii (Join-Path $outDir "working-tree.diff")
            exit 0
          }

          $base = $null
          foreach ($cand in @('main','master','origin/main','origin/master','origin/HEAD')) {
            if ($cand -eq $port) { continue }
            if ((git rev-parse --verify --quiet $cand)) { $base = $cand; break }
          }
          if (-not $base) {
            $base = (git rev-list --max-parents=0 "$port" | Select-Object -Last 1)
          }

          $forkPoint = (git merge-base $base $port).Trim()
          if (-not $forkPoint) { $forkPoint = $base }
          Write-Host "Base: $base  fork-point: $forkPoint  tip: $portSha"

          $range       = "$forkPoint..$port"
          $commitCount = [int](git rev-list --count $range)
          Write-Host "Commits on $port since fork: $commitCount"

          git log --oneline $range | Tee-Object (Join-Path $outDir "commits.txt")
          git diff --stat   $range | Tee-Object (Join-Path $outDir "diffstat.txt")

          if ($commitCount -eq 0) {
            Write-Warning "No commits on '$port' — capturing diffs as fallback."
            git diff --binary $range | Out-File -Encoding ascii (Join-Path $outDir "arm64-port.diff")
            git diff --binary HEAD   | Out-File -Encoding ascii (Join-Path $outDir "working-tree.diff")
          } else {
            $combined = Join-Path $outDir "arm64-port.patch"
            $diffText = (git diff --binary $range | Out-String)
            [System.IO.File]::WriteAllText($combined, $diffText, (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "Wrote combined patch: $combined"

            New-Item -ItemType Directory -Force -Path $seriesDir | Out-Null
            $series = git format-patch $range -o $seriesDir
            Write-Host "Wrote $($series.Count) per-commit patch file(s) to $seriesDir"
          }

          if (Test-Path "ARM64-PORT.md") {
            Copy-Item "ARM64-PORT.md" (Join-Path $outDir "ARM64-PORT.md") -Force
          } else {
            Write-Warning "ARM64-PORT.md was not produced — Phase 8 did not complete."
          }

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copilot-run-log
          path: C:\src\wos-porter\_logs\**
          if-no-files-found: warn

      - name: Upload ARM64 port artifacts (patch + report)
        if: always() && steps.clone.outputs.repo_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: arm64-port-copilot-${{ steps.clone.outputs.repo_name }}
          path: C:\src\wos-porter\_artifacts\**
          if-no-files-found: warn

      - name: Upload full ported working tree (branch arm64-port)
        if: always() && steps.clone.outputs.repo_dir != ''
        uses: actions/upload-artifact@v7
        with:
          name: ported-repo-copilot-${{ steps.clone.outputs.repo_name }}
          path: |
            ${{ steps.clone.outputs.repo_dir }}/**
            !${{ steps.clone.outputs.repo_dir }}/**/node_modules/**
            !${{ steps.clone.outputs.repo_dir }}/**/target/**
            !${{ steps.clone.outputs.repo_dir }}/**/build/**
            !${{ steps.clone.outputs.repo_dir }}/**/build-arm64/**
            !${{ steps.clone.outputs.repo_dir }}/**/out/**
            !${{ steps.clone.outputs.repo_dir }}/**/x64/**
            !${{ steps.clone.outputs.repo_dir }}/**/Debug/**
            !${{ steps.clone.outputs.repo_dir }}/**/Release/**
          if-no-files-found: warn
